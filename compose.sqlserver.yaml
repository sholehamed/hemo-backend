services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "127.0.0.1:14333:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your shell}"
    volumes:
      - hemo_sql_data:/var/opt/mssql
volumes:
  hemo_sql_data: {}
